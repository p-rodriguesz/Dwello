name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dwello
          MYSQL_USER: dwello
          MYSQL_PASSWORD: dwello
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    env:
      DATABASE_URL: mysql://dwello:dwello@127.0.0.1:3306/dwello
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      UPLOAD_DIR: storage/uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
      - name: Prepare database
        run: npm run setup:db
      - name: Seed database
        run: npm run seed
      - name: Build backend
        run: npm run build
      - name: Test backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build frontend
        run: npm run build
