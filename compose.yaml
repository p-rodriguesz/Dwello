services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dwello}
      MYSQL_USER: ${MYSQL_USER:-dwello}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dwello}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/dwello.sql:/docker-entrypoint-initdb.d/01-dwello.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-dwello}:${MYSQL_PASSWORD:-dwello}@db:3306/${MYSQL_DATABASE:-dwello}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: ${DOCKER_API_URL:-http://api:3000}
    environment:
      API_URL: ${DOCKER_API_URL:-http://api:3000}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
